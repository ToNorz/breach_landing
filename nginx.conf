server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache immutable Vite hashed assets in /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Common browser icons & metadata (suppress 404 error log noise)
    location ~* /(favicon\.ico|apple-touch-icon.*\.png|favicon.*\.png|favicon\.svg|robots\.txt)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # Ensure index.html is NEVER cached so clients always get latest JS/CSS hashes on deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # SPA routing fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
